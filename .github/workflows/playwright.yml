name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  core-tests:
    outputs:
      report_ready: ${{ steps.report_check.outputs.report_ready }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble  # keep in sync with @playwright/test in package.json
      options: --ipc=host --user pwuser
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run type check
        run: npm run typecheck
      - name: Run lint
        run: npm run lint
      - name: Run Playwright tests
        run: npm run test
      - name: Check Playwright report availability
        id: report_check
        if: ${{ always() && !cancelled() }}
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "report_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-core
          path: playwright-report/
          retention-days: 30
      - name: Upload GitHub Pages artifact
        if: >-
          ${{
            !cancelled() &&
            github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
            steps.report_check.outputs.report_ready == 'true'
          }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/
      - name: Add PR report link to job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.report_check.outputs.report_ready == 'true' }}
        run: |
          {
            echo "### Playwright Report Artifact (Core)"
            echo ""
            echo "Download the \`playwright-report-core\` artifact from the [workflow run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

  visual-regression:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble  # keep in sync with @playwright/test in package.json
      options: --ipc=host --user pwuser
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run visual regression tests
        run: npm run test:visual
      - name: Check Playwright report availability
        id: report_check
        if: ${{ always() && !cancelled() }}
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "report_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.report_check.outputs.report_ready == 'true' }}
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 30
      - name: Add PR report link to job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.report_check.outputs.report_ready == 'true' }}
        run: |
          {
            echo "### Playwright Report Artifact (Visual)"
            echo ""
            echo "Download the \`playwright-report-visual\` artifact from the [workflow run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: core-tests
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
        needs.core-tests.result != 'cancelled' &&
        needs.core-tests.outputs.report_ready == 'true'
      }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Add report link to job summary
        run: |
          {
            echo "### Playwright Report"
            echo ""
            echo "- [Open latest Playwright report](${{ steps.deployment.outputs.page_url }})"
          } >> "$GITHUB_STEP_SUMMARY"
